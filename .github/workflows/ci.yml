# Run tests for code2prompt
name: Code2prompt Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Run tests
      run: cargo test --verbose

  python-bindings:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Install uv and Python
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.10"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: crates/code2prompt-python/uv.lock
    - name: Sync Python project
      working-directory: crates/code2prompt-python
      run: uv sync --locked
    - name: Run Python tests
      working-directory: crates/code2prompt-python
      run: uv run --locked pytest
    - name: Build release wheel
      if: matrix.python-version == '3.11'
      working-directory: crates/code2prompt-python
      run: uv run --locked maturin build --release --out ../../dist
